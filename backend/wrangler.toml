name = "translink-qld"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "translink_qld"
database_id = "4282adc2-f3f6-409c-a3f4-7382872ff110"

[[kv_namespaces]]
binding = "RT_CACHE"
id = "81f9f0a72cba43ca86547f2598459f65"

[vars]
TRANSLINK_GTFS_URL = "https://gtfsrt.api.translink.com.au/GTFS/SEQ_GTFS.zip"
TRANSLINK_RT_TRIP_UPDATES = "https://gtfsrt.api.translink.com.au/api/realtime/SEQ/TripUpdates"
# Reserved for a future alerts endpoint — not yet read anywhere.
TRANSLINK_RT_ALERTS = "https://gtfsrt.api.translink.com.au/api/realtime/SEQ/Alerts"
RT_CACHE_TTL_SECONDS = "20"
