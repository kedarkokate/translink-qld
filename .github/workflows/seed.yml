name: Seed remote D1

# Runs the GTFS chunked seed script against the production Cloudflare D1
# database. Replaces the laptop-side launchd job — execution now happens on
# GitHub-hosted runners.
#
#   - workflow_dispatch  : manual button in the Actions tab (or `gh workflow run`)
#   - schedule           : Sundays 17:00 UTC ⇒ Mondays 03:00 Brisbane (UTC+10)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   D1_ACCOUNT_ID   - your Cloudflare account id
#   D1_DATABASE_ID  - the D1 database id for translink_qld
#   D1_API_TOKEN    - a Cloudflare API token scoped to D1:Edit on this account

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Max rows this run may write (default 10M = one-shot)"
        required: false
        default: "10000000"
  schedule:
    - cron: "0 17 * * 0"

permissions:
  contents: read

concurrency:
  # Never let two seeds clobber each other's progress markers.
  group: seed-remote
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run chunked seed
        working-directory: backend
        env:
          D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          SEED_BUDGET: ${{ github.event.inputs.budget || '10000000' }}
        run: npm run seed:remote
