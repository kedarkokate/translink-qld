name: TransitQLD
options:
  bundleIdPrefix: au.com.transitqld
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: "1.0.0"

targets:
  TransitQLD:
    type: application
    platform: iOS
    sources:
      - path: TransitQLD
    info:
      path: TransitQLD/Info.plist
      properties:
        CFBundleDisplayName: TransitQLD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Used to show nearby bus, train, ferry and tram stops."
        ITSAppUsesNonExemptEncryption: false
        # Needed so `canOpenURL(comgooglemaps://)` can detect Google Maps.
        LSApplicationQueriesSchemes:
          - comgooglemaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.transitqld.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 62FZ5PWUFZ
        CODE_SIGN_STYLE: Automatic
